<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Chart Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .chart-container { position: relative; height: 75vh; width: 100%; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#191919] text-gray-900 dark:text-gray-100">

    <!-- Setup Screen -->
    <div id="setup-screen" class="max-w-md mx-auto mt-12 p-8 bg-white dark:bg-zinc-900 rounded-xl shadow-2xl border border-gray-100 dark:border-zinc-800">
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b dark:border-zinc-800">
            <i class="lucide-database text-blue-500 w-6 h-6"></i>
            <h1 class="text-xl font-bold">Connect Your Database</h1>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">Paste Database Link or ID</label>
                <input id="db-input" type="text" placeholder="https://www.notion.so/..." 
                    class="w-full p-3 bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="p-3 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-900/30 rounded-lg text-xs text-amber-800 dark:text-amber-200">
                <strong>Important:</strong> In Notion, go to your Database page → Click "..." → "Add connections" → and search for your integration name.
            </div>

            <button id="connect-btn" onclick="fetchData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center space-x-2">
                <span id="btn-text">Load Data</span>
            </button>
            
            <div id="error-box" class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/30 rounded-lg">
                <p id="error-msg" class="text-red-600 dark:text-red-400 text-sm"></p>
            </div>
        </div>
    </div>

    <!-- Chart Screen -->
    <div id="chart-screen" class="hidden h-screen flex flex-col">
        <header class="flex items-center justify-between p-4 border-b dark:border-zinc-800 bg-white dark:bg-zinc-900">
            <div class="flex items-center space-x-4">
                <button onclick="showSetup()" class="p-2 hover:bg-gray-100 dark:hover:bg-zinc-800 rounded-lg">
                    <i class="lucide-settings w-5 h-5"></i>
                </button>
                <select id="chart-type" onchange="updateChart()" class="bg-transparent text-sm font-bold outline-none">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="doughnut">Doughnut</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <select id="label-prop" onchange="updateChart()" class="text-xs bg-gray-100 dark:bg-zinc-800 rounded p-1"></select>
                <select id="value-prop" onchange="updateChart()" class="text-xs bg-gray-100 dark:bg-zinc-800 rounded p-1"></select>
                <button onclick="fetchData()" class="p-2"><i class="lucide-refresh-cw w-4 h-4"></i></button>
            </div>
        </header>

        <main class="flex-1 p-8 flex items-center justify-center">
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        const TOKEN = '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';
        let dbResults = [];
        let chart = null;

        function showSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('chart-screen').classList.add('hidden');
        }

        async function fetchData() {
            const input = document.getElementById('db-input').value.trim();
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-msg');
            const btnText = document.getElementById('btn-text');

            if (!input) {
                errorBox.classList.remove('hidden');
                errorMsg.innerText = "Please paste a link or ID.";
                return;
            }

            // Extract ID from link like https://www.notion.so/ID?v=...
            const idMatch = input.match(/[a-f0-9]{32}/i);
            const dbId = idMatch ? idMatch[0] : input;

            btnText.innerText = "Connecting...";
            errorBox.classList.add('hidden');

            try {
                // Using corsproxy.io to bypass Notion's CORS policy in the browser
                const proxy = "https://corsproxy.io/?";
                const api = `https://api.notion.com/v1/databases/${dbId}/query`;

                const response = await fetch(proxy + encodeURIComponent(api), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not find database. Check 'Add Connection' in Notion.");
                }

                dbResults = data.results;
                if (dbResults.length === 0) throw new Error("The database is empty.");

                populateOptions(dbResults[0].properties);
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('chart-screen').classList.remove('hidden');
                updateChart();

            } catch (err) {
                errorBox.classList.remove('hidden');
                errorMsg.innerText = err.message;
            } finally {
                btnText.innerText = "Load Data";
            }
        }

        function populateOptions(props) {
            const lSelect = document.getElementById('label-prop');
            const vSelect = document.getElementById('value-prop');
            lSelect.innerHTML = "";
            vSelect.innerHTML = "";

            Object.keys(props).forEach(key => {
                const opt = `<option value="${key}">${key}</option>`;
                lSelect.innerHTML += opt;
                if (props[key].type === 'number' || props[key].type === 'formula') {
                    vSelect.innerHTML += opt;
                }
            });
            if (vSelect.innerHTML === "") vSelect.innerHTML = lSelect.innerHTML;
        }

        function extractVal(item, name) {
            const p = item.properties[name];
            if (!p) return 0;
            if (p.type === 'title') return p.title[0]?.plain_text || "Untitled";
            if (p.type === 'number') return p.number || 0;
            if (p.type === 'select') return p.select?.name || "";
            if (p.type === 'status') return p.status?.name || "";
            if (p.type === 'formula') return p.formula.number || 0;
            return 0;
        }

        function updateChart() {
            if (chart) chart.destroy();

            const lProp = document.getElementById('label-prop').value;
            const vProp = document.getElementById('value-prop').value;
            const type = document.getElementById('chart-type').value;

            const labels = dbResults.map(i => extractVal(i, lProp));
            const values = dbResults.map(i => extractVal(i, vProp));

            const ctx = document.getElementById('mainChart').getContext('2d');
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            chart = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: vProp,
                        data: values,
                        backgroundColor: type.includes('pie') ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] : '#3b82f6cc',
                        borderColor: '#3b82f6',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: isDark ? '#fff' : '#000' } } },
                    scales: (type === 'bar' || type === 'line') ? {
                        y: { ticks: { color: isDark ? '#aaa' : '#666' } },
                        x: { ticks: { color: isDark ? '#aaa' : '#666' } }
                    } : {}
                }
            });
        }
    </script>
</body>
</html>
