<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Chart Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .chart-container { position: relative; height: 70vh; width: 100%; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#191919] text-gray-900 dark:text-gray-100 transition-colors">

    <!-- Setup Screen -->
    <div id="setup-screen" class="max-w-md mx-auto mt-10 p-6">
        <div class="flex items-center space-x-2 mb-6 border-b border-gray-200 dark:border-gray-800 pb-4">
            <i class="lucide-settings text-blue-500 w-6 h-6"></i>
            <h1 class="text-xl font-bold">Chart Widget Setup</h1>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Database ID</label>
                <input id="db-id" type="text" placeholder="Paste Database ID..." 
                    class="w-full p-2 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-md text-sm text-blue-700 dark:text-blue-300">
                <strong>Token:</strong> Used from your previous message.
            </div>

            <button id="connect-btn" onclick="fetchData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md transition flex items-center justify-center">
                <span id="btn-text">Connect Database</span>
            </button>
            
            <p id="error-msg" class="text-red-500 text-sm hidden"></p>
        </div>
    </div>

    <!-- Chart Screen -->
    <div id="chart-screen" class="hidden h-screen flex flex-col">
        <header class="flex items-center justify-between p-3 border-b border-gray-200 dark:border-gray-800">
            <div class="flex items-center space-x-2">
                <button onclick="showSetup()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">
                    <i class="lucide-settings w-4 h-4"></i>
                </button>
                <select id="chart-type" onchange="updateChart()" class="bg-transparent text-sm font-medium border border-gray-200 dark:border-gray-700 rounded px-2 py-1">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="doughnut">Doughnut</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <select id="label-prop" onchange="updateChart()" class="text-xs bg-gray-100 dark:bg-gray-800 border-none rounded p-1"></select>
                <select id="value-prop" onchange="updateChart()" class="text-xs bg-gray-100 dark:bg-gray-800 border-none rounded p-1"></select>
                <button onclick="fetchData()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">
                    <i class="lucide-refresh-cw w-4 h-4"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 p-6">
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        const NOTION_TOKEN = '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';
        let databaseData = [];
        let myChart = null;

        function showSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('chart-screen').classList.add('hidden');
        }

        async function fetchData() {
            const dbId = document.getElementById('db-id').value;
            const btn = document.getElementById('connect-btn');
            const errorMsg = document.getElementById('error-msg');

            if (!dbId) {
                errorMsg.innerText = "Please enter a Database ID.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            document.getElementById('btn-text').innerText = "Connecting...";
            errorMsg.classList.add('hidden');

            try {
                // Using a proxy is required because Notion blocks browser requests (CORS)
                const proxy = "https://corsproxy.io/?";
                const url = `https://api.notion.com/v1/databases/${dbId}/query`;

                const response = await fetch(proxy + encodeURIComponent(url), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${NOTION_TOKEN}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error("Connection failed. Check your ID and access.");

                const data = await response.json();
                databaseData = data.results;

                if (databaseData.length === 0) throw new Error("Database is empty.");

                populateSelects(databaseData[0].properties);
                
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('chart-screen').classList.remove('hidden');
                updateChart();

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                document.getElementById('btn-text').innerText = "Connect Database";
            }
        }

        function populateSelects(properties) {
            const labelSel = document.getElementById('label-prop');
            const valueSel = document.getElementById('value-prop');
            labelSel.innerHTML = "";
            valueSel.innerHTML = "";

            Object.keys(properties).forEach(key => {
                const opt = `<option value="${key}">${key}</option>`;
                labelSel.innerHTML += opt;
                if (properties[key].type === 'number' || properties[key].type === 'formula') {
                    valueSel.innerHTML += opt;
                }
            });

            // If no numbers found, just add everything to value select too
            if (valueSel.innerHTML === "") {
                valueSel.innerHTML = labelSel.innerHTML;
            }
        }

        function getVal(item, propName) {
            const prop = item.properties[propName];
            if (!prop) return 0;
            if (prop.type === 'title') return prop.title[0]?.plain_text || "Untitled";
            if (prop.type === 'number') return prop.number || 0;
            if (prop.type === 'select') return prop.select?.name || "";
            if (prop.type === 'status') return prop.status?.name || "";
            if (prop.type === 'formula') return prop.formula.number || 0;
            return 0;
        }

        function updateChart() {
            if (myChart) myChart.destroy();

            const labelProp = document.getElementById('label-prop').value;
            const valueProp = document.getElementById('value-prop').value;
            const type = document.getElementById('chart-type').value;

            const labels = databaseData.map(d => getVal(d, labelProp));
            const values = databaseData.map(d => getVal(d, valueProp));

            const ctx = document.getElementById('mainChart').getContext('2d');
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            myChart = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: valueProp,
                        data: values,
                        backgroundColor: type === 'pie' || type === 'doughnut' 
                            ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] 
                            : '#3b82f6cc',
                        borderColor: '#3b82f6',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: isDark ? '#fff' : '#000' } }
                    },
                    scales: (type === 'bar' || type === 'line') ? {
                        y: { ticks: { color: isDark ? '#aaa' : '#666' } },
                        x: { ticks: { color: isDark ? '#aaa' : '#666' } }
                    } : {}
                }
            });
        }
    </script>
</body>
</html>
