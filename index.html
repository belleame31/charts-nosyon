<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Chart Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
</head>
<body class="bg-white dark:bg-[#0f0f0f] text-slate-900 dark:text-slate-100 p-6">
    <div id="setup" class="max-w-md mx-auto mt-20 space-y-6">
        <h1 class="text-2xl font-black">Notion Chart Setup</h1>
        <input id="db-url" type="text" placeholder="Paste Notion Database Link" class="w-full p-4 bg-slate-100 dark:bg-zinc-800 rounded-2xl outline-none">
        <button onclick="load()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl">Generate Chart</button>
        <p id="err" class="text-red-500 text-xs hidden"></p>
    </div>

    <div id="chart-view" class="hidden h-screen flex flex-col">
        <header class="p-4 border-b dark:border-zinc-800 flex justify-between">
            <button onclick="location.reload()" class="p-2 bg-slate-100 dark:bg-zinc-800 rounded-lg"><i class="lucide-settings w-4 h-4"></i></button>
            <div class="flex space-x-2">
                <select id="l-prop" onchange="render()" class="text-xs bg-slate-100 dark:bg-zinc-800 rounded p-1"></select>
                <select id="v-prop" onchange="render()" class="text-xs bg-slate-100 dark:bg-zinc-800 rounded p-1 text-blue-500"></select>
            </div>
        </header>
        <div class="flex-1 p-10"><canvas id="canvas"></canvas></div>
    </div>

    <script>
        let results = [];
        let chart = null;

        async function load() {
            const url = document.getElementById('db-url').value;
            const id = url.match(/[a-f0-9]{32}/i);
            if (!id) return alert("Invalid URL");

            try {
                const res = await fetch(`/api/notion?databaseId=${id[0]}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || data.error);

                results = data.results;
                setup(results[0].properties);
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('chart-view').classList.remove('hidden');
                render();
            } catch (e) {
                const el = document.getElementById('err');
                el.innerText = e.message;
                el.classList.remove('hidden');
            }
        }

        function setup(props) {
            const l = document.getElementById('l-prop');
            const v = document.getElementById('v-prop');
            Object.keys(props).forEach(k => {
                const o = `<option value="${k}">${k}</option>`;
                l.innerHTML += o;
                if (['number', 'formula'].includes(props[k].type)) v.innerHTML += o;
            });
            if (!v.innerHTML) v.innerHTML = l.innerHTML;
        }

        function render() {
            if (chart) chart.destroy();
            const lP = document.getElementById('l-prop').value;
            const vP = document.getElementById('v-prop').value;
            const ctx = document.getElementById('canvas').getContext('2d');
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            const get = (i, n) => {
                const p = i.properties[n];
                if (p.type === 'title') return p.title[0]?.plain_text || "Untitled";
                if (p.type === 'number') return p.number || 0;
                return 0;
            };

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: results.map(r => get(r, lP)),
                    datasets: [{ label: vP, data: results.map(r => get(r, vP)), backgroundColor: '#2563ebcc', borderRadius: 8 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: dark ? '#222' : '#eee' } } } }
            });
        }
    </script>
</body>
</html>
