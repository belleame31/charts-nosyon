<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Chart Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .chart-container { position: relative; height: 70vh; width: 100%; }
        .hidden { display: none; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#ffffff] dark:bg-[#191919] text-gray-900 dark:text-gray-100">

    <!-- Setup Screen -->
    <div id="setup-screen" class="max-w-lg mx-auto mt-10 p-8 bg-white dark:bg-zinc-900 rounded-xl shadow-2xl border border-gray-100 dark:border-zinc-800">
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b dark:border-zinc-800">
            <div class="bg-blue-500 p-2 rounded-lg text-white">
                <i class="lucide-line-chart"></i>
            </div>
            <h1 class="text-xl font-bold">Notion Chart Setup</h1>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Internal Integration Secret</label>
                <input id="token-input" type="password" placeholder="ntn_..." 
                    value="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"
                    class="w-full p-3 bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Database Link or ID</label>
                <input id="db-input" type="text" placeholder="https://www.notion.so/..." 
                    class="w-full p-3 bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <div class="p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900/30 rounded-lg">
                <h3 class="text-xs font-bold text-blue-800 dark:text-blue-300 mb-1">Final Checklist:</h3>
                <ul class="text-[11px] text-blue-700 dark:text-blue-400 space-y-1 list-disc ml-4">
                    <li>Database page → <strong>"..."</strong> menu → <strong>"Add connections"</strong> → Search and invite your integration.</li>
                    <li>Ensure your token starts with <code>ntn_</code> or <code>secret_</code>.</li>
                </ul>
            </div>

            <button id="connect-btn" onclick="fetchData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center transition-all shadow-lg shadow-blue-500/20">
                <div id="loader" class="hidden loader mr-3"></div>
                <span id="btn-text">Generate Chart</span>
            </button>
            
            <div id="error-box" class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/30 rounded-lg">
                <div class="flex items-center space-x-2 text-red-600 dark:text-red-400 mb-1">
                    <i class="lucide-alert-circle w-4 h-4"></i>
                    <span class="text-sm font-bold">Error</span>
                </div>
                <p id="error-msg" class="text-red-500 dark:text-red-400 text-xs leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- Chart Screen -->
    <div id="chart-screen" class="hidden h-screen flex flex-col">
        <header class="flex items-center justify-between p-4 border-b dark:border-zinc-800 bg-white dark:bg-zinc-900">
            <div class="flex items-center space-x-4">
                <button onclick="showSetup()" class="p-2 hover:bg-gray-100 dark:hover:bg-zinc-800 rounded-lg transition">
                    <i class="lucide-settings w-5 h-5 text-gray-500"></i>
                </button>
                <div class="h-6 w-px bg-gray-200 dark:bg-zinc-800"></div>
                <select id="chart-type" onchange="updateChart()" class="bg-transparent text-sm font-bold outline-none cursor-pointer">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="doughnut">Doughnut</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <select id="label-prop" onchange="updateChart()" class="text-[10px] uppercase font-bold tracking-tight bg-gray-100 dark:bg-zinc-800 rounded px-2 py-1 outline-none border-none"></select>
                <i class="lucide-chevron-right w-3 h-3 text-gray-400"></i>
                <select id="value-prop" onchange="updateChart()" class="text-[10px] uppercase font-bold tracking-tight bg-gray-100 dark:bg-zinc-800 rounded px-2 py-1 outline-none border-none"></select>
                <button onclick="fetchData()" class="ml-2 p-2 bg-blue-50 dark:bg-blue-900/20 text-blue-600 rounded-lg"><i class="lucide-refresh-cw w-4 h-4"></i></button>
            </div>
        </header>

        <main class="flex-1 p-8 flex items-center justify-center overflow-hidden">
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        let dbResults = [];
        let chartInstance = null;

        function showSetup() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('chart-screen').classList.add('hidden');
        }

        async function fetchData() {
            const token = document.getElementById('token-input').value.trim();
            const input = document.getElementById('db-input').value.trim();
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-msg');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btn-text');

            if (!token || !input) {
                showError("Please fill in both the Token and the Database Link.");
                return;
            }

            // Extract ID: Supports full URL or just the 32-char string
            const idMatch = input.match(/[a-f0-9]{32}/i);
            const dbId = idMatch ? idMatch[0] : input;

            errorBox.classList.add('hidden');
            loader.classList.remove('hidden');
            btnText.innerText = "Connecting...";

            try {
                // Using a CORS proxy is strictly necessary for browser-to-notion requests
                const proxy = "https://corsproxy.io/?";
                const api = `https://api.notion.com/v1/databases/${dbId}/query`;

                const response = await fetch(proxy + encodeURIComponent(api), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Notion-Version': '2022-06-28',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ page_size: 100 })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (data.status === 401) throw new Error("Invalid API Token. Check for extra spaces or if it was revoked.");
                    if (data.status === 404) throw new Error("Database not found. Did you forget to 'Add Connection' inside Notion?");
                    throw new Error(data.message || "Connection failed.");
                }

                dbResults = data.results;
                if (!dbResults || dbResults.length === 0) throw new Error("Connected, but the database has no rows.");

                setupSelects(dbResults[0].properties);
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('chart-screen').classList.remove('hidden');
                updateChart();

            } catch (err) {
                showError(err.message);
            } finally {
                loader.classList.add('hidden');
                btnText.innerText = "Generate Chart";
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = msg;
            errorBox.classList.remove('hidden');
        }

        function setupSelects(props) {
            const lSel = document.getElementById('label-prop');
            const vSel = document.getElementById('value-prop');
            lSel.innerHTML = "";
            vSel.innerHTML = "";

            Object.keys(props).forEach(key => {
                const type = props[key].type;
                const opt = `<option value="${key}">${key}</option>`;
                lSel.innerHTML += opt;
                if (['number', 'formula', 'rollup'].includes(type)) {
                    vSel.innerHTML += opt;
                }
            });
            if (vSel.innerHTML === "") vSel.innerHTML = lSel.innerHTML;
        }

        function parseVal(item, name) {
            const p = item.properties[name];
            if (!p) return 0;
            if (p.type === 'title') return p.title[0]?.plain_text || "Untitled";
            if (p.type === 'number') return p.number || 0;
            if (p.type === 'select') return p.select?.name || "";
            if (p.type === 'status') return p.status?.name || "";
            if (p.type === 'formula') return p.formula.number || p.formula.string || 0;
            return 0;
        }

        function updateChart() {
            if (chartInstance) chartInstance.destroy();

            const lName = document.getElementById('label-prop').value;
            const vName = document.getElementById('value-prop').value;
            const type = document.getElementById('chart-type').value;

            const labels = dbResults.map(i => parseVal(i, lName));
            const values = dbResults.map(i => parseVal(i, vName));

            const ctx = document.getElementById('mainChart').getContext('2d');
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const color = '#3b82f6';

            chartInstance = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: vName,
                        data: values,
                        backgroundColor: type.includes('pie') ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] : `${color}44`,
                        borderColor: color,
                        borderWidth: 2,
                        borderRadius: type === 'bar' ? 6 : 0,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            display: type.includes('pie'),
                            labels: { color: isDark ? '#fff' : '#000' }
                        }
                    },
                    scales: !type.includes('pie') ? {
                        y: { ticks: { color: isDark ? '#888' : '#666' }, grid: { color: isDark ? '#222' : '#eee' } },
                        x: { ticks: { color: isDark ? '#888' : '#666' }, grid: { display: false } }
                    } : {}
                }
            });
        }
    </script>
</body>
</html>
